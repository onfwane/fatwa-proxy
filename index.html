<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>شات الفتاوى الإسلامية 📜</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Amiri', serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
      overflow: hidden;
      transition: 0.3s;
      direction: rtl;
    }

    .stars {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .stars span {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      opacity: 0.6;
      animation: moveStars 6s linear infinite;
    }

    @keyframes moveStars {
      0% { transform: translateY(100vh); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    .chat-container {
      width: 360px;
      max-width: 95%;
      background: #2c2c2c;
      margin: 40px auto;
      padding: 20px;
      border-radius: 20px;
      position: relative;
      color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
    }

    .theme-toggle {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: white;
    }

    .sun-icon {
      width: 80px;
      height: 80px;
      margin: 10px auto;
      background: radial-gradient(circle, #ffcc00, #ff9900);
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(255, 204, 0, 0.8);
    }

    .chat-box {
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-message, .bot-message {
      padding: 10px 15px;
      border-radius: 15px;
      max-width: 80%;
      font-size: 16px;
      line-height: 1.4;
      animation: fadeIn 0.3s ease-in-out;
    }

    .user-message {
      background-color: #d2e3f3;
      color: black;
      align-self: flex-end;
    }

    .bot-message {
      background-color: #3a3a3a;
      color: white;
      align-self: flex-start;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-container {
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex-grow: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background: #444;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .chat-input::placeholder {
      color: #bbb;
    }

    .send-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 20px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="chat-container">
    <div class="header">
      <h2>🏰 شات الفتاوى الإسلامية 📜</h2>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="sun-icon"></div>

    <div id="chat" class="chat-box">
      <!-- رسائل تظهر هنا -->
    </div>

    <div class="input-container">
      <input id="chatInput" type="text" class="chat-input" placeholder="✍️ اكتب سؤالك هنا..." onkeypress="handleKey(event)">
      <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('light');
    }

    function createStars() {
      const starsContainer = document.getElementById('stars');
      for (let i = 0; i < 60; i++) {
        const star = document.createElement('span');
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.animationDuration = Math.random() * 4 + 3 + 's';
        starsContainer.appendChild(star);
      }
    }

    createStars();

    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const chat = document.getElementById("chat");
      const message = input.value.trim();

      if (!message) return;

      // أضف رسالة المستخدم
      const userBubble = document.createElement("div");
      userBubble.className = "user-message";
      userBubble.textContent = message;
      chat.appendChild(userBubble);
      input.value = "";

      // أضف رد مؤقت
      const botBubble = document.createElement("div");
      botBubble.className = "bot-message";
      botBubble.textContent = "جاري المعالجة...";
      chat.appendChild(botBubble);
      chat.scrollTop = chat.scrollHeight;

      // استدعاء API
      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        botBubble.textContent = data.result || "❌ لا يوجد رد.";
      } catch (e) {
        botBubble.textContent = "حدث خطأ في الاتصال بالخادم.";
      }

      chat.scrollTop = chat.scrollHeight;
    }

    function handleKey(e) {
      if (e.key === "Enter") sendMessage();
    }
  </script>
</body>
</html>
