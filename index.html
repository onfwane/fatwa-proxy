<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>مساعد الفتاوى الإسلامية</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Amiri", serif;
      background: linear-gradient(to bottom, #1e3c72, #2a5298);
      text-align: center;
      margin: 0;
      padding: 0;
      direction: rtl;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: 5vh auto;
      padding: 20px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.4);
    }

    h2 {
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      resize: none;
      font-family: inherit;
    }

    button {
      margin-top: 10px;
      padding: 10px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #ffa500;
      color: #000;
    }

    pre {
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      text-align: right;
      direction: rtl;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🏛️ شات الفتاوى الإسلامية</h2>
    <textarea id="question" placeholder="اكتب سؤالك الشرعي هنا..."></textarea><br>
    <button onclick="askFatwa()">استفسر الآن</button>
    <pre id="response">... الرد سيظهر هنا</pre>
  </div>

  <script>
    async function askFatwa() {
      const input = document.getElementById("question").value;
      const responseBox = document.getElementById("response");
      responseBox.innerText = "جاري إرسال السؤال...";

      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question: input })
        });

        const data = await res.json();
        responseBox.innerText = data.result || "لا يوجد رد.";
      } catch (err) {
        responseBox.innerText = "حدث خطأ أثناء الاتصال بالخادم.";
      }
    }
  </script>
</body>
</html>
