<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شات الفتاوى الإسلامية 📜</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Amiri", serif;
      background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
      margin: 0;
      padding: 0;
      color: white;
      overflow: hidden;
    }

    .stars {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .stars span {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      animation: move 5s linear infinite;
    }

    @keyframes move {
      0% { transform: translateY(100vh); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    .chat-container {
      width: 400px;
      max-width: 90%;
      margin: 50px auto;
      background-color: rgba(0, 0, 0, 0.75);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .header {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .icon {
      display: block;
      margin: 0 auto 20px;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #ffc107, #ff9800);
      border-radius: 50%;
      box-shadow: 0 0 30px #ffc107;
    }

    .chat-output {
      height: 300px;
      overflow-y: auto;
      background: #222;
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .chat-output p {
      margin: 5px 0;
      padding: 8px;
      border-radius: 10px;
      max-width: 80%;
    }

    .user-message {
      background-color: #2196f3;
      align-self: flex-end;
      color: white;
      text-align: right;
    }

    .bot-message {
      background-color: #4caf50;
      text-align: right;
      color: white;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #chatInput {
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      outline: none;
      text-align: center;
    }

    button {
      background: orange;
      border: none;
      padding: 10px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #ff9800;
    }
  </style>
</head>
<body>

  <div class="stars"></div>
  <div class="chat-container">
    <div class="header">🏰 شات الفتاوى الإسلامية 📜</div>
    <div class="icon"></div>
    <div class="chat-output" id="chatOutput">
      <p class="bot-message">... الرد سيظهر هنا</p>
    </div>

    <div class="input-area">
      <input type="text" id="chatInput" placeholder="✍️ اكتب سؤالك الشرعي هنا..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">استفسر الآن</button>
    </div>
  </div>

  <script>
    function createStars() {
      const stars = document.querySelector(".stars");
      for (let i = 0; i < 60; i++) {
        const star = document.createElement("span");
        star.style.left = Math.random() * 100 + "vw";
        star.style.top = Math.random() * 100 + "vh";
        star.style.animationDuration = Math.random() * 3 + 2 + "s";
        stars.appendChild(star);
      }
    }
    createStars();

    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const chatOutput = document.getElementById("chatOutput");
      const question = input.value.trim();
      if (!question) return;

      chatOutput.innerHTML += `<p class="user-message">${question}</p>`;
      input.value = "";
      chatOutput.scrollTop = chatOutput.scrollHeight;

      const responseBox = document.createElement("p");
      responseBox.className = "bot-message";
      responseBox.innerText = "⏳ جاري التحميل...";
      chatOutput.appendChild(responseBox);
      chatOutput.scrollTop = chatOutput.scrollHeight;

      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        const data = await res.json();
        responseBox.innerText = data.answer || "❌ لم يتم العثور على إجابة.";
      } catch (err) {
        responseBox.innerText = "⚠️ حدث خطأ في الاتصال.";
      }

      chatOutput.scrollTop = chatOutput.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") sendMessage();
    }
  </script>
</body>
</html>
