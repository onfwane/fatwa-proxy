<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شات الفتاوى الإسلامية 📜</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Amiri', serif;
      background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
      margin: 0;
      padding: 0;
      direction: rtl;
      overflow: hidden;
    }

    .stars {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .stars span {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      opacity: 0.8;
      animation: moveStars 8s linear infinite;
    }

    @keyframes moveStars {
      0% { transform: translateY(100vh); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    .chat-container {
      position: relative;
      width: 400px;
      height: 90vh;
      margin: 5vh auto;
      background-color: #252525;
      border-radius: 25px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header {
      padding: 15px;
      text-align: center;
      color: white;
      font-size: 24px;
    }

    .icon {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle at 50% 50%, #ffcc00, #ff9f00);
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(255, 204, 0, 0.9);
      margin: 0 auto;
      animation: floatingMoon 4s infinite ease-in-out alternate;
    }

    @keyframes floatingMoon {
      from { transform: translateY(-5px); }
      to   { transform: translateY(5px); }
    }

    #chatOutput {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
      color: white;
      font-size: 18px;
    }

    #chatOutput p {
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .input-container {
      display: flex;
      padding: 10px;
      background: #333;
      border-bottom-left-radius: 25px;
      border-bottom-right-radius: 25px;
    }

    #chatInput {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      outline: none;
      background: #444;
      color: white;
      text-align: right;
    }

    #chatInput::placeholder {
      color: #ccc;
    }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="chat-container">
  <div class="header">🏰 شات الفتاوى الإسلامية 📜</div>
  <div class="icon"></div>

  <div id="chatOutput"></div>

  <div class="input-container">
    <input type="text" id="chatInput" placeholder="📝 اكتب سؤالك هنا..." onkeypress="handleKeyPress(event)">
  </div>
</div>

<script>
  // نجوم
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    let star = document.createElement('span');
    star.style.left = Math.random() * 100 + "vw";
    star.style.animationDuration = Math.random() * 4 + 3 + "s";
    starsContainer.appendChild(star);
  }

  // إرسال الرسالة
  async function sendMessage() {
    const input = document.getElementById("chatInput");
    const chatOutput = document.getElementById("chatOutput");
    const message = input.value.trim();

    if (!message) return;

    chatOutput.innerHTML += `<p style="background:#2a5298;">${message}</p>`;
    input.value = "";
    chatOutput.scrollTop = chatOutput.scrollHeight;

    try {
      const response = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: message })
      });

      const data = await response.json();
      const answer = data.answer || "❌ لم يتم العثور على رد.";
      chatOutput.innerHTML += `<p>${answer}</p>`;
      chatOutput.scrollTop = chatOutput.scrollHeight;

    } catch (error) {
      chatOutput.innerHTML += `<p>❌ حدث خطأ أثناء الاتصال بالخادم.</p>`;
    }
  }

  function handleKeyPress(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  }
</script>
</body>
</html>
