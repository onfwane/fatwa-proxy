<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>مساعد الذكي</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Amiri", serif;
      background: linear-gradient(to bottom, #1e3c72, #2a5298);
      text-align: center;
      margin: 0;
      padding: 0;
      overflow: hidden;
      transition: background 0.5s ease-in-out, color 0.5s ease-in-out;
    }

    body.dark-mode {
      background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
      color: white;
    }

    .stars {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .stars span {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      opacity: 0.8;
      animation: moveStars 5s linear infinite;
    }

    @keyframes moveStars {
      0% { transform: translateY(100vh); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    .chat-container {
      width: 90%;
      max-width: 450px;
      height: auto;
      margin: 5vh auto;
      padding: 20px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    body.dark-mode .chat-container {
      background: rgba(44, 44, 44, 0.9);
    }

    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px;
      position: relative;
      cursor: pointer;
    }

    .icon {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at 50% 50%, #ffcc00, #ff9f00);
      border-radius: 50%;
      box-shadow: 0px 0px 50px rgba(255, 204, 0, 0.9);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      animation: floatingMoon 4s infinite ease-in-out alternate;
    }

    @keyframes floatingMoon {
      from { transform: translate(-50%, -55%); }
      to { transform: translate(-50%, -45%); }
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border-radius: 15px;
      border: none;
      font-size: 16px;
      resize: none;
      background: #f2f2f2;
      font-family: "Amiri", serif;
      box-sizing: border-box;
    }

    body.dark-mode textarea {
      background: #444;
      color: white;
    }

    button {
      margin-top: 10px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease-in-out;
    }

    button:hover {
      background-color: #2980b9;
    }

    pre {
      margin-top: 15px;
      text-align: right;
      background: rgba(240, 240, 240, 0.9);
      padding: 15px;
      border-radius: 15px;
      font-family: "Amiri", serif;
      white-space: pre-wrap;
      direction: rtl;
    }

    body.dark-mode pre {
      background: rgba(60, 60, 60, 0.9);
      color: white;
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <div class="chat-container">
    <div class="header">
      <h2>مساعد الذكي - مجاني بالكامل</h2>
    </div>

    <div class="icon-container" onclick="toggleTheme()">
      <div class="icon" id="moon"></div>
    </div>

    <textarea id="question" placeholder="اكتب سؤالك الشرعي هنا..."></textarea>
    <button onclick="askFatwa()">استفسر الآن</button>
    <pre id="response">...الرد سيظهر هنا</pre>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      localStorage.setItem("theme", document.body.classList.contains("dark-mode") ? "dark" : "light");
    }

    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
    }

    function createStars() {
      const starsContainer = document.querySelector(".stars");
      for (let i = 0; i < 50; i++) {
        let star = document.createElement("span");
        star.style.left = Math.random() * 100 + "vw";
        star.style.animationDuration = Math.random() * 4 + 3 + "s";
        starsContainer.appendChild(star);
      }
    }
    createStars();

    async function askFatwa() {
      const input = document.getElementById("question").value;
      const responseBox = document.getElementById("response");
      responseBox.innerText = "...جاري إرسال السؤال";

      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: [
              { role: "system", content: "تكلم بالعربية" },
              { role: "user", content: input }
            ]
          })
        });

        const data = await res.json();
        responseBox.innerText = data.result;
      } catch (err) {
        responseBox.innerText = "حدث خطأ أثناء الاتصال بالخادم.";
      }
    }
  </script>
</body>
</html>
