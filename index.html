<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شات الفتاوى الإسلامية</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Amiri', serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #e0eafc, #cfdef3);
      transition: background 0.4s ease-in-out, color 0.4s ease-in-out;
    }
    body.dark-mode {
      background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
      color: white;
    }
    .chat-container {
      max-width: 600px;
      margin: 5vh auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0px 8px 24px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: background 0.4s;
    }
    body.dark-mode .chat-container {
      background: rgba(44, 44, 44, 0.95);
    }
    h2 {
      text-align: center;
      margin: 0;
    }
    #chatOutput {
      max-height: 50vh;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bot-message, .user-message {
      padding: 10px 15px;
      border-radius: 15px;
      max-width: 80%;
      animation: fadeIn 0.3s ease-in-out;
    }
    .user-message {
      align-self: flex-end;
      background: #cce5ff;
    }
    .bot-message {
      align-self: flex-start;
      background: #343a40;
      color: white;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .input-container {
      display: flex;
      gap: 10px;
    }
    .search-box {
      flex: 1;
      padding: 12px;
      border-radius: 25px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    .toggle-btn {
      background: #f0ad4e;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      align-self: flex-end;
    }
    body.dark-mode .toggle-btn {
      background: #ffc107;
      color: black;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <button class="toggle-btn" onclick="toggleTheme()">🌓</button>
    <h2>شات الفتاوى الإسلامية 📜</h2>
    <div id="chatOutput"></div>
    <div class="input-container">
      <input type="text" id="chatInput" class="search-box" placeholder="✍️ اكتب سؤالك هنا..." onkeypress="handleKeyPress(event)">
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      localStorage.setItem("theme", document.body.classList.contains("dark-mode") ? "dark" : "light");
    }
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById("chatInput");
      const chatOutput = document.getElementById("chatOutput");
      const question = input.value.trim();
      if (!question) return;

      chatOutput.innerHTML += `<p class="user-message">${question}</p>`;
      input.value = "";
      chatOutput.scrollTop = chatOutput.scrollHeight;

      fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      })
      .then(res => res.json())
      .then(data => {
        chatOutput.innerHTML += `<p class="bot-message">${data.result}</p>`;
        chatOutput.scrollTop = chatOutput.scrollHeight;
      })
      .catch(() => {
        chatOutput.innerHTML += `<p class="bot-message">❌ حدث خطأ في الاتصال بالخادم.</p>`;
      });
    }
  </script>
</body>
</html>
