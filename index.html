<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساعد الفتاوى الذكي</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Amiri', serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #1e3c72, #2a5298);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-box {
      background: #111;
      padding: 20px;
      border-radius: 15px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    h2 {
      text-align: center;
      margin-bottom: 15px;
      color: #f9c74f;
    }
    textarea {
      width: 100%;
      height: 80px;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-family: 'Amiri', serif;
      font-size: 18px;
      resize: none;
    }
    button {
      width: 100%;
      background: #f9c74f;
      color: #000;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
    }
    pre {
      background: #222;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      font-family: 'Amiri', serif;
      font-size: 16px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="chat-box">
    <h2>🏛️ شات الفتاوى الإسلامية 📄</h2>
    <textarea id="question" placeholder="اكتب سؤالك هنا..."></textarea>
    <button onclick="askFatwa()">استفسر الآن</button>
    <pre id="response">لا يوجد رد.</pre>
  </div>
  <script>
    async function askFatwa() {
      const input = document.getElementById("question").value.trim();
      const responseBox = document.getElementById("response");

      if (!input) return;

      responseBox.innerText = "... جاري الاستعلام";

      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: input })
        });

        const data = await res.json();
        responseBox.innerText = data.result || "لا يوجد رد.";
      } catch (err) {
        responseBox.innerText = "حدث خطأ في الاتصال بالخادم.";
      }
    }
  </script>
</body>
</html>
